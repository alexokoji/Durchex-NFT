name: Reconcile chain state

# Vercel's Hobby plan allows one cron run a day, which is why every missed
# sale, offer and listing fill so far has needed a manual repair. This runs
# at GitHub's shortest allowed interval, five minutes, at no cost.
#
# Five is a floor GitHub enforces, not a promise it keeps: scheduled runs
# are queued and routinely delayed under load, so the real cadence is
# closer to five-to-fifteen minutes and an occasional tick is skipped
# outright. That is tolerable here only because every pass is idempotent —
# a late run repairs exactly what a punctual one would. If a tighter and
# firmer interval is ever needed, a Cloudflare Worker cron trigger goes
# down to one minute on its free tier and actually holds to it.
on:
  schedule:
    - cron: "*/5 * * * *"
  # So it can be run on demand from the Actions tab without waiting.
  workflow_dispatch:

# A long run must never overlap the next tick and race it.
concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile Ethereum mainnet
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set on this repository — add it under Settings › Secrets and variables › Actions."
            exit 1
          fi

          response=$(curl -sS --max-time 120 -w '\n%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.durchex.com/api/cron/reconcile-all?chainId=1")

          body=$(printf '%s' "$response" | sed '$d')
          status=$(printf '%s' "$response" | tail -n1)

          echo "$body"

          # A non-200, or a run where some step failed, should turn the
          # workflow red — a silent failure here is how drift accumulated
          # in the first place.
          if [ "$status" != "200" ]; then
            echo "Reconcile returned HTTP $status"
            exit 1
          fi
          if printf '%s' "$body" | grep -q '"ok":false'; then
            echo "At least one reconcile step failed"
            exit 1
          fi
